<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Studio Parcial </title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* NAVBAR */
        header{
            background:#222;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 60px;
        }

        header h2{
            font-size:20px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
        }

        nav a:hover{
            color:#9d7dff;
        }

        /* HERO */

        .hero{
            background:linear-gradient(90deg,#6a00ff,#3d5afe);
            color:white;
            text-align:center;
            padding:90px 20px;
        }

        .hero h1{
            font-size:48px;
            margin-bottom:15px;
        }

        .hero p{
            font-size:18px;
        }

        /* GALERIA */

        section{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        section h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .galeria{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        .galeria img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:10px;
            transition:.3s;
        }

        .galeria img:hover{
            transform:scale(1.03);
        }

        /* FORMULARIO */

        .contenedor-form{
            display:flex;
            justify-content:center;
        }

        form{
            background:white;
            width:420px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        form h2{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            background:#4169e1;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#284cc7;
        }

        /* FOOTER */

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:25px;
            margin-top:40px;
        }

        footer a{
            color:white;
            text-decoration:none;
            margin:0 10px;
        }

        @media(max-width:900px){

            .galeria{
                grid-template-columns:repeat(2,1fr);
            }

        }

        @media(max-width:600px){

            header{
                flex-direction:column;
                gap:15px;
            }

            .hero h1{
                font-size:35px;
            }

            .galeria{
                grid-template-columns:1fr;
            }

            form{
                width:100%;
            }

        }

    </style>

</head>
<body>

<header>

    <h2>DG Studio</h2>

    <nav>
        <a href="#">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#registro">Registro</a>
    </nav>

</header>

<section class="hero">

    <h1>Bienvenido a DG Studio</h1>

    <p>Descubre diseños creativos, inspiración y comparte tu pasión por el diseño gráfico.</p>

</section>

<section id="galeria">

    <h2>Nuestra Galería</h2>

    <div class="galeria">

        <img src="https://picsum.photos/500/300?1" alt="">
        <img src="https://picsum.photos/500/300?2" alt="">
        <img src="https://picsum.photos/500/300?3" alt="">
        <img src="https://picsum.photos/500/300?4" alt="">
        <img src="https://picsum.photos/500/300?5" alt="">
        <img src="https://picsum.photos/500/300?6" alt="">

    </div>

</section>

<section id="registro">

    <div class="contenedor-form">

        <form>

            <h2>Formulario de Registro</h2>

            <label>Nombre Completo</label>
            <input type="text" placeholder="Ingrese su nombre">

            <label>Correo Electrónico</label>
            <input type="email" placeholder="ejemplo@gmail.com">

            <label>Contraseña</label>
            <input type="password" placeholder="********">

            <button>Registrarse</button>

        </form>

    </div>

</section>

<footer>

    <p>© 2026 DG Studio | Todos los derechos reservados.</p>

    <br>

    <a href="#">Facebook</a> |
    <a href="#">Instagram</a> |
    <a href="#">Twitter</a>

</footer>

</body>
</html>
