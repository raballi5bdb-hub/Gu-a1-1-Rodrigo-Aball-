<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de Fotos</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <header class="container py-5 text-center">
        <h1 class="fw-bold display-5">Mi Galería de Fotos</h1>
        <p class="text-muted">Proyecto simple para GitHub Pages</p>
    </header>

    <main class="container pb-5">
        <div class="row g-4">
            <!-- Imagen 1 -->
            <div class="col-sm-6 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <img src="https://picsum.photos/600/400?random=1" class="card-img-top" alt="Foto 1">
                    <div class="card-body">
                        <h5 class="card-title fs-6">Paisaje</h5>
                    </div>
                </div>
            </div>
            <!-- Imagen 2 -->
            <div class="col-sm-6 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <img src="https://picsum.photos/600/400?random=2" class="card-img-top" alt="Foto 2">
                    <div class="card-body">
                        <h5 class="card-title fs-6">Arquitectura</h5>
                    </div>
                </div>
            </div>
            <!-- Imagen 3 -->
            <div class="col-sm-6 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <img src="https://picsum.photos/600/400?random=3" class="card-img-top" alt="Foto 3">
                    <div class="card-body">
                        <h5 class="card-title fs-6">Minimalismo</h5>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-muted border-top bg-white">
        <p class="mb-0 small">&copy; 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
